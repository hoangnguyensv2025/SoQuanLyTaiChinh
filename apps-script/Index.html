<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b77"><title>Sổ Quản Lý V10</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#14263d;background:#f3f6fb;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid #ced9e8;border-radius:10px;padding:11px 12px;background:#fff;color:#13263a;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #9fc3ff;border-color:#3c79e0}label{display:block;font-weight:650;font-size:12px;color:#506078;margin:0 0 5px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0}.app{max-width:1600px;min-height:100dvh;margin:auto;display:flex}.sidebar{width:225px;flex-shrink:0;background:#fff;border-right:1px solid #e4ebf3;padding:22px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100dvh}.logo{font-weight:850;color:#14418e;font-size:18px;padding:5px 11px 25px}.logo small{font-size:10px;display:block;color:#71829a;margin:4px 0 0 24px;letter-spacing:1px}.sidebar nav{display:grid;gap:4px}.navbtn{border:0;background:transparent;border-radius:12px;padding:12px;text-align:left;display:flex;gap:11px;color:#53647b;font-weight:650;align-items:center}.navbtn.active{color:#164ab3;background:#e9f0ff}.navbtn .ic{font-size:19px}.footnote{margin-top:auto;font-size:11px;line-height:1.5;color:#8c98a8;padding:15px}.main{flex:1;min-width:0;padding:24px 28px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.eyebrow{font-size:10px;color:#72839a;letter-spacing:1px;font-weight:750;margin-bottom:5px}#scope{border:0;background:transparent;padding:0 25px 0 0;font-weight:850;font-size:20px;max-width:350px}.top-right{display:flex;gap:10px;align-items:center}.localtag{border-radius:20px;padding:6px 10px;color:#086c5b;background:#dcf6ee;font-size:12px}.iconbutton{border:1px solid #d7e2ed;background:white;border-radius:10px;padding:9px 13px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.subtitle{color:#708197;margin-top:6px;font-size:12px}.btn{background:#2259c9;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:700;white-space:nowrap}.btn.alt{background:#e7efff;color:#2259c9}.btn.gray{background:#eef2f7;color:#334155}.btn.danger{background:#fee8e8;color:#b42318}.btn.sm{padding:7px 10px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.card,.panel{background:white;border:1px solid #e2e9f3;border-radius:15px;padding:17px;box-shadow:0 1px 3px #0e295005}.metric{font-size:24px;font-weight:850;margin:7px 0 2px;overflow-wrap:anywhere}.hint{font-size:12px;color:#708197}.positive{color:#097f58}.negative{color:#c23439}.warn{color:#b36c00}.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar>*{max-width:240px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th,td{padding:11px;border-bottom:1px solid #edf1f7;font-size:13px}th{color:#73839b;font-size:11px;text-transform:uppercase}tbody tr:hover{background:#f8fbff}.chip{border-radius:100px;padding:4px 9px;font-size:11px;font-weight:750;background:#edf1f7;color:#53657b}.chip.warn{background:#fff1d9;color:#995a00}.chip.ok{background:#def6e9;color:#0e8057}.chip.bad{background:#fde9e9;color:#ba3131}.chip.blue{background:#e5efff;color:#2157b7}.row-actions{display:flex;gap:5px}.tabs{display:flex;gap:6px;margin:0 0 15px;flex-wrap:wrap}.tab{background:#e9edf4;border:0;border-radius:10px;padding:9px 12px;color:#4b617c}.tab.active{background:#2259c9;color:white}.barline{display:grid;grid-template-columns:115px 1fr 115px;align-items:center;gap:8px;margin:12px 0}.track{height:11px;border-radius:100px;background:#ecf0f6;overflow:hidden}.fill{height:100%;background:#487ce2;border-radius:100px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{margin-bottom:12px}.note{border-left:3px solid #5185df;background:#f0f5ff;padding:11px 13px;border-radius:7px;color:#425a7b;font-size:12px;line-height:1.55;margin:10px 0}.listline{border:1px solid #e5eaf2;border-left:4px solid #4576ce;border-radius:10px;padding:12px;margin:8px 0;background:#f7f9fd}.listline:nth-child(even){background:#fff}.side-by-side{display:flex;justify-content:space-between;gap:12px;align-items:center}.money{font-weight:750}.empty{padding:36px;text-align:center;color:#8392a5}.mobile-nav{display:none}dialog{border:0;border-radius:18px;padding:0;width:min(700px,calc(100vw - 20px));max-height:92dvh;box-shadow:0 22px 90px #0f23434a;overflow:auto}dialog::backdrop{background:#10243b9e}.modal-head{position:sticky;top:0;background:#fff;padding:18px 20px;border-bottom:1px solid #e5eaf2;display:flex;justify-content:space-between;z-index:3}.close{border:0;background:#f1f4f8;border-radius:9px;padding:8px 12px}#modalContent{padding:20px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173b77;color:#fff;border-radius:12px;padding:13px 18px;display:none;z-index:9;max-width:90%}.thumb{max-width:150px;max-height:110px;border-radius:8px}.separator{border:0;border-top:1px solid #e4eaf1;margin:15px 0}details.filters{background:white;border:1px solid #e2e9f3;padding:12px 15px;border-radius:13px;margin-bottom:14px}details.filters summary{cursor:pointer;font-weight:750;color:#334c70}.smhelp{font-size:11px;color:#8191a4}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.content-grid{grid-template-columns:1fr}}@media(max-width:740px){.sidebar{display:none}.main{padding:16px 12px 115px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:4;background:#fff;border-top:1px solid #dce5ef;padding:6px 4px max(6px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:1px}.mobile-nav .navbtn{display:flex;flex-direction:column;justify-content:center;text-align:center;gap:2px;font-size:10px;padding:7px 1px}.mobile-nav .navbtn .ic{font-size:20px}.top{margin-bottom:18px}.page-head{align-items:flex-start}.page-head h1{font-size:21px}.cards{gap:8px}.card,.panel{padding:12px}.metric{font-size:19px}.cols2,.cols3{grid-template-columns:1fr}.toolbar>*{max-width:100%}.barline{grid-template-columns:78px 1fr 85px;font-size:11px}.table-wrap{margin:0 -10px}#scope{font-size:17px;max-width:230px}dialog{width:calc(100vw - 12px);max-height:94dvh}#modalContent{padding:14px}.localtag{font-size:10px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo">▣ <span>SỔ QUẢN LÝ</span><small>V10 · LOCAL</small></div><nav id="nav"></nav><div class="footnote">Dữ liệu thử nghiệm lưu trên thiết bị.<br>Để kết nối Drive, triển khai bản Apps Script trong ZIP.</div></aside><main class="main"><header class="top"><div><div class="eyebrow">KHÔNG GIAN QUẢN LÝ</div><select id="scope" aria-label="Chọn lĩnh vực"></select></div><div class="top-right"><span class="localtag">● Local</span><button class="iconbutton" id="backupTop" title="Xuất bản sao JSON">⇩</button></div></header><section id="view" aria-live="polite"></section></main></div><nav class="mobile-nav" id="mobileNav"></nav><dialog id="modal"><form method="dialog" class="modal-head"><h2 id="modalTitle">Nhập liệu</h2><button class="close" value="cancel" aria-label="Đóng">✕</button></form><div id="modalContent"></div></dialog><div class="toast" id="toast" role="status"></div><input type="file" id="importFile" hidden accept="application/json"><script>/* Sổ Quản Lý V9 — vanilla JS, zero third-party dependencies. Values of money are integer VND. */
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>globalThis.crypto?.randomUUID?.()||('id_'+Date.now()+'_'+Math.random().toString(36).slice(2));
const today=()=>new Date().toLocaleDateString('en-CA');
const money=n=>Math.round(Number(n)||0).toLocaleString('vi-VN')+'đ';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>Number(x)||0;
const fmtDate=x=>x?new Date(x+'T12:00:00').toLocaleDateString('vi-VN'):'';
const setDate=(x)=>String(x||today()).slice(0,10);
const DBNAME='soquanly-v9';const STORE='snapshots';
const schema={businesses:[],accounts:[],customers:[],products:[],orders:[],purchases:[],movements:[],expenses:[],transfers:[],audit:[],settings:{},invoiceSequences:{}};
function initial(){let b=uid(),cash=uid(),bank=uid();return {...structuredClone(schema),businesses:[{id:b,name:'Kinh doanh chính',active:true,createdAt:today()}],accounts:[{id:cash,name:'Tiền mặt',opening:0,scope:'shared',businessId:null,active:true},{id:bank,name:'Ngân hàng',opening:0,scope:'shared',businessId:null,active:true}],settings:{defaultBusiness:b,defaultAccount:cash,defaultPersonalAccount:cash,defaultPurchaseAccount:cash,defaultSaleAccount:cash},invoiceSequences:{}}}
let db=initial(),route='dashboard',scope='all',reportMode='business',reportPeriod='month',reportMonth=today().slice(0,7),filterText='',editingLines=[],editingImage='',filterOpen=false;
const adapter={async load(){return new Promise((resolve)=>{try{const req=indexedDB.open(DBNAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE);req.onsuccess=()=>{const tx=req.result.transaction(STORE,'readonly');const get=tx.objectStore(STORE).get('data');get.onsuccess=()=>resolve(get.result||null);get.onerror=()=>resolve(null)};req.onerror=()=>resolve(JSON.parse(localStorage.getItem(DBNAME)||'null'))}catch(e){resolve(JSON.parse(localStorage.getItem(DBNAME)||'null'))}})},async save(obj){try{await new Promise((resolve,reject)=>{const req=indexedDB.open(DBNAME,1);req.onsuccess=()=>{const tx=req.result.transaction(STORE,'readwrite');tx.objectStore(STORE).put(obj,'data');tx.oncomplete=resolve;tx.onerror=reject};req.onerror=reject})}catch(e){localStorage.setItem(DBNAME,JSON.stringify(obj))}}};
function patch(raw){const d={...structuredClone(schema),...raw};for(const key of Object.keys(schema))if(Array.isArray(schema[key])&&!Array.isArray(d[key]))d[key]=[];d.settings||={};d.invoiceSequences||={};return d}
// Cloud mode is available only from the authorized Apps Script Web App URL.
const CLOUD_MODE=!!(window.google&&google.script&&google.script.run);
let cloudRevision=0, cloudBase=null,cloudReady=false,cloudBusy=false;
function cloudCall(name,arg){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err?.message||String(err))))[name](arg))}
function changedRows(before,after){const changes=[];for(const key of Object.keys(schema)){
 if(Array.isArray(schema[key])){
  const oldMap=new Map((before[key]||[]).map(x=>[String(x.id),x]));const newMap=new Map((after[key]||[]).map(x=>[String(x.id),x]));
  for(const [id,item] of newMap){const old=oldMap.get(id);if(!old||JSON.stringify(old)!==JSON.stringify(item))changes.push({table:key,id,oldVersion:old?Number(old.version||0):0,record:item})}
  for(const [id,old] of oldMap)if(!newMap.has(id))changes.push({table:key,id,oldVersion:Number(old.version||0),deleted:true});
 }else if(JSON.stringify(before[key])!==JSON.stringify(after[key]))changes.push({table:key,id:'__singleton__',oldValue:before[key],value:after[key],singleton:true});
}return changes}
function showConnect(message='Lần đầu sử dụng, hãy kết nối Google Drive để tạo dữ liệu ứng dụng.'){
 let el=document.getElementById('cloudGate');if(!el){el=document.createElement('div');el.id='cloudGate';el.style='position:fixed;inset:0;z-index:99999;background:#f4f7fb;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Arial,sans-serif';document.body.append(el)}
 el.innerHTML='<div style="background:white;border-radius:20px;padding:25px;max-width:460px;width:100%;box-shadow:0 14px 60px #0012"><h2 style="margin-top:0">☁ Kết nối Google Drive</h2><p id="gateMsg" style="line-height:1.6"></p><p style="font-size:13px;color:#666">Google có thể yêu cầu cấp quyền vào Drive và Sheets khi chạy lần đầu. Ứng dụng không yêu cầu N nhập mật khẩu Google trực tiếp.</p><button id="startConnect" style="background:#215bc5;color:white;border:0;padding:13px 18px;border-radius:10px;cursor:pointer;width:100%">Kết nối và khởi tạo dữ liệu</button><p style="font-size:12px;color:#666">Chỉ triển khai Web App cho người được phép sử dụng. Các nhân viên dùng chung URL, không cần chia sẻ mật khẩu.</p></div>';
 document.getElementById('gateMsg').textContent=message;
 document.getElementById('startConnect').onclick=async()=>{const b=document.getElementById('startConnect');b.disabled=true;b.textContent='Đang khởi tạo...';try{const data=await cloudCall('apiInitialize');cloudRevision=data.revision||0;db=patch(data.data);cloudBase=structuredClone(db);cloudReady=true;el.remove();render();toast('Đã kết nối Google Drive và tải dữ liệu')}catch(e){document.getElementById('gateMsg').textContent='Kết nối chưa thành công: '+e.message;b.disabled=false;b.textContent='Thử lại kết nối'}}
}
let saving=Promise.resolve();function persist(){const snapshot=structuredClone(db);saving=saving.then(async()=>{
 if(!CLOUD_MODE){await adapter.save(snapshot);return}
 if(!cloudReady)throw Error('Chưa kết nối Drive');
 const changes=changedRows(cloudBase,snapshot).filter(c=>c.table!=='invoiceSequences');if(!changes.length)return;
 const result=await cloudCall('apiCommit',{revision:cloudRevision,changes,requestId:uid()});
 if(!result.ok){cloudReady=false;showConnect('Dữ liệu đã thay đổi từ thiết bị khác hoặc phát hiện xung đột. Bấm kết nối để tải lại dữ liệu mới; thông tin chưa đồng bộ cần nhập lại.');throw Error(result.error||'SYNC_CONFLICT')}
 cloudRevision=result.revision;for(const assigned of result.assignedCodes||[]){const target=db.orders.find(o=>o.id===assigned.id);if(target)target.code=assigned.code;const original=snapshot.orders.find(o=>o.id===assigned.id);if(original)original.code=assigned.code;}cloudBase=structuredClone(snapshot);
 }).catch(e=>{toast('Đồng bộ chưa thành công: '+e.message);console.error(e)});return saving}

function audit(entity,id,action,before,after){db.audit.unshift({id:uid(),entity,entityId:id,action,date:new Date().toISOString(),before:before??null,after:after??null});if(db.audit.length>2000)db.audit.length=2000}
function storeRecord(key,record){const ix=db[key].findIndex(x=>x.id===record.id),old=ix<0?null:structuredClone(db[key][ix]);record={...record,version:(old?.version||0)+1,updatedAt:new Date().toISOString()};if(ix<0)db[key].push(record);else db[key][ix]=record;audit(key,record.id,old?'update':'create',old,record);persist();render();return record}
function removeRecord(key,id){const old=db[key].find(x=>x.id===id);if(!old)return;db[key]=db[key].filter(x=>x.id!==id);audit(key,id,'delete',old,null);persist();render()}
function askDelete(key,id){if(confirm('Xác nhận xóa? Đây là dữ liệu demo. Lịch sử thay đổi vẫn được ghi nhận.'))removeRecord(key,id)}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',3200)}
const activeBusinesses=()=>db.businesses.filter(x=>x.active!==false);
const bname=id=>db.businesses.find(x=>x.id===id)?.name||'Không xác định';
const aname=id=>db.accounts.find(x=>x.id===id)?.name||'Nguồn không xác định';
const pname=id=>db.products.find(x=>x.id===id)?.name||'Sản phẩm đã xóa';
const cname=id=>db.customers.find(x=>x.id===id)?.name||'Khách lẻ';
const filteredBiz=id=>scope==='all'||scope===id;
const availableAccounts=b=>db.accounts.filter(a=>a.active!==false&&(a.scope==='shared'||a.businessId===b));
function accountOptions(b,selected){return availableAccounts(b).map(a=>`<option value="${esc(a.id)}" ${a.id===selected?'selected':''}>${esc(a.name)} — ${money(accountBalance(a.id))}</option>`).join('')}
function businessOptions(sel){return activeBusinesses().map(b=>`<option value="${esc(b.id)}" ${sel===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
function selectProductOptions(b){return db.products.filter(p=>p.businessId===b&&p.active!==false).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.sku||'')} · tồn ${qtyStock(p.id)}</option>`).join('')}
function signedMovements(){const moves=[];for(const o of db.orders){if(o.kind==='temporary')continue;const paid=num(o.paid);if(paid)moves.push({accountId:o.accountId,value:paid,kind:'sale',ref:o.id});if(o.status==='returned'&&num(o.refund))moves.push({accountId:o.refundAccountId||o.accountId,value:-num(o.refund),kind:'refund',ref:o.id})}for(const p of db.purchases){if(num(p.paid))moves.push({accountId:p.accountId,value:-num(p.paid),kind:'purchase',ref:p.id})}for(const e of db.expenses){moves.push({accountId:e.accountId,value:e.type==='income'?num(e.amount):-num(e.amount),kind:e.type,ref:e.id})}for(const t of db.transfers){moves.push({accountId:t.from,value:-num(t.amount),kind:'transfer',ref:t.id},{accountId:t.to,value:num(t.amount),kind:'transfer',ref:t.id})}return moves}
function accountBalance(id){return num(db.accounts.find(a=>a.id===id)?.opening)+signedMovements().filter(x=>x.accountId===id).reduce((s,x)=>s+x.value,0)}
function inventoryEvents(pid){let events=[];const p=db.products.find(x=>x.id===pid);if(!p)return events;events.push({date:'1900-01-01',type:'opening',delta:num(p.openingQty),unit:num(p.openingCost)});for(const x of db.purchases)for(const l of x.lines||[])if(l.productId===pid)events.push({date:x.date,type:'purchase',delta:num(l.qty),unit:num(l.cost),id:x.id});for(const x of db.orders)if(x.kind!=='temporary')for(const l of x.lines||[])if(l.productId===pid){events.push({date:x.date,type:'sale',delta:-num(l.qty),unit:0,id:x.id});if(x.status==='returned'&&x.restock!==false)events.push({date:x.returnDate||x.date,type:'return',delta:num(l.qty),unit:num(l.costSnapshot),id:x.id+'r'})}for(const x of db.movements)if(x.productId===pid)events.push({date:x.date,type:'adjust',delta:num(x.qty),unit:num(x.unitCost),id:x.id});return events.sort((a,b)=>a.date.localeCompare(b.date)||({opening:0,purchase:1,adjust:2,sale:3,return:4}[a.type]-{opening:0,purchase:1,adjust:2,sale:3,return:4}[b.type]))}
function qtyStock(pid){return inventoryEvents(pid).reduce((s,x)=>s+x.delta,0)}
function averageCost(pid){let qty=0,value=0;for(const ev of inventoryEvents(pid)){if(ev.delta>0){const u=ev.type==='return'?ev.unit:ev.unit|| (qty>0?value/qty:0);qty+=ev.delta;value+=ev.delta*u}else if(ev.delta<0){const mean=qty>0?value/qty:0;qty+=ev.delta;value=Math.max(0,value+ev.delta*mean);if(qty<=0){value=0}}}return qty>0?value/qty:0}
function quoteCost(pid,date){let qty=0,value=0;for(const ev of inventoryEvents(pid).filter(x=>x.date<=date)){if(ev.delta>0){qty+=ev.delta;value+=ev.delta*(ev.unit|| (qty>ev.delta?value/(qty-ev.delta):0))}else{const avg=qty>0?value/qty:0;qty+=ev.delta;value=Math.max(0,value+ev.delta*avg);if(qty<=0)value=0}}return qty>0?value/qty:num(db.products.find(p=>p.id===pid)?.openingCost)}
function stats(b='all',month=null){const match=id=>b==='all'||id===b, inTime=date=>!month||String(date||'').slice(0,7)===month;let revenue=0,cogs=0,expense=0,other=0,sales=0;for(const o of db.orders){if(o.kind==='temporary'||o.status==='returned'||!match(o.businessId)||!inTime(o.date))continue;sales++;revenue+=num(o.total);cogs+=(o.lines||[]).reduce((s,l)=>s+num(l.qty)*num(l.costSnapshot),0)}for(const e of db.expenses){if(e.domain!=='business'||!inTime(e.date))continue;for(const a of e.allocations||[{businessId:e.businessId,amount:e.amount}])if(match(a.businessId)){if(e.type==='income')other+=num(a.amount);else expense+=num(a.amount)}}return {revenue,cogs,expense,other,profit:revenue-cogs-expense+other,sales}}
function getScopeBusiness(){return scope==='all'?(db.settings.defaultBusiness||activeBusinesses()[0]?.id):scope}
function el(head,body='',button=''){return `<div class="page-head"><div><h1>${head}</h1><div class="subtitle">${body}</div></div>${button}</div>`}
function metric(t,v,h='',cl=''){return `<div class="card"><div class="hint">${esc(t)}</div><div class="metric ${cl}">${v}</div><div class="hint">${h}</div></div>`}
const tabs=[['dashboard','⌂','Tổng quan'],['reports','▥','Báo cáo'],['orders','▤','Hóa đơn'],['purchases','▣','Nhập hàng'],['products','◈','Sản phẩm / kho'],['customers','♧','Khách hàng'],['finance','₫','Tài chính'],['settings','⚙','Thiết lập']];
function nav(){const html=tabs.map(([id,icon,name])=>`<button class="navbtn ${id===route?'active':''}" data-route="${id}"><span class="ic">${icon}</span><span>${name}</span></button>`).join('');$('#nav').innerHTML=html;$('#mobileNav').innerHTML=html}
function render(){nav();$('#scope').innerHTML=`<option value="all">Tất cả lĩnh vực</option>`+businessOptions(scope);$('#scope').value=scope;const views={dashboard, reports,orders,purchases,products,customers,finance,settings};$('#view').innerHTML=views[route]();}
function dashboard(){const s=stats(scope);const tmp=db.orders.filter(x=>x.kind==='temporary'&&filteredBiz(x.businessId)).length;const rows=activeBusinesses().filter(b=>filteredBiz(b.id)).map(b=>({name:b.name,...stats(b.id)}));return el('Tổng quan hoạt động','Xem nhanh doanh thu, lợi nhuận, tồn kho và chứng từ',`<button class="btn" data-action="neworder">+ Tạo hóa đơn</button>`)+`<div class="cards">${metric('Doanh thu',money(s.revenue),s.sales+' hóa đơn')}${metric('Giá vốn',money(s.cogs),'Giá vốn đã lưu theo hóa đơn')}${metric('Chi phí KD',money(s.expense),'Không gồm chi cá nhân')}${metric('Lợi nhuận ước tính',money(s.profit),'Bao gồm khoản thu khác',s.profit<0?'negative':'positive')}</div><div class="content-grid"><div class="panel"><h2>Lợi nhuận theo lĩnh vực</h2>${bars(rows.map(r=>({label:r.name,value:r.profit})))}</div><div class="panel"><h2>Việc cần chú ý</h2><div class="listline">📷 <b>${tmp}</b> hóa đơn tạm cần bổ sung</div><div class="listline">📦 <b>${db.products.filter(p=>filteredBiz(p.businessId)&&qtyStock(p.id)<0).length}</b> sản phẩm tồn âm</div><div class="listline">💳 <b>${db.orders.filter(o=>o.kind!=='temporary'&&o.status!=='returned'&&filteredBiz(o.businessId)&&num(o.paid)<num(o.total)).length}</b> hóa đơn còn phải thu</div><div class="note">Lợi nhuận chỉ chính xác khi giá vốn, chi phí và hàng hoàn được nhập đầy đủ. Tiền nhập hàng không tự trừ toàn bộ vào lợi nhuận.</div></div></div>`}
function bars(rows){let max=Math.max(1,...rows.map(r=>Math.abs(r.value)));return rows.length?rows.map(r=>`<div class="barline"><span>${esc(r.label)}</span><div class="track"><div class="fill" style="width:${Math.abs(r.value)/max*100}%;background:${r.value<0?'#dc6565':'#4b7ddd'}"></div></div><b class="${r.value<0?'negative':''}">${money(r.value)}</b></div>`).join(''):'<div class="empty">Chưa có dữ liệu</div>'}
function reports(){const choices=`<div class="tabs"><button class="tab ${reportMode==='business'?'active':''}" data-action="reportMode" data-val="business">Kinh doanh</button><button class="tab ${reportMode==='personal'?'active':''}" data-action="reportMode" data-val="personal">Cá nhân</button></div><div class="toolbar"><select id="period"><option value="month" ${reportPeriod==='month'?'selected':''}>Theo tháng</option><option value="year" ${reportPeriod==='year'?'selected':''}>Theo năm</option></select><input id="month" type="${reportPeriod==='month'?'month':'number'}" min="2020" max="2100" value="${reportPeriod==='month'?reportMonth:reportMonth.slice(0,4)}"></div>`;if(reportMode==='personal'){const rows=db.expenses.filter(e=>e.domain==='personal'&&e.date.startsWith(reportPeriod==='month'?reportMonth:reportMonth.slice(0,4)));const income=rows.filter(e=>e.type==='income').reduce((s,e)=>s+num(e.amount),0),out=rows.filter(e=>e.type==='expense').reduce((s,e)=>s+num(e.amount),0);const cat={};rows.filter(e=>e.type==='expense').forEach(e=>cat[e.category]=(cat[e.category]||0)+num(e.amount));return el('Báo cáo tài chính','Theo dõi số liệu theo tháng hoặc năm')+choices+`<div class="cards">${metric('Thu nhập',money(income))}${metric('Chi tiêu',money(out))}${metric('Chênh lệch',money(income-out))}${metric('Giao dịch',rows.length)}</div><div class="panel"><h2>Chi theo danh mục</h2>${bars(Object.entries(cat).map(([label,value])=>({label,value})))}</div>`}const yr=reportMonth.slice(0,4),period=reportPeriod==='month'?reportMonth:null;let tot=stats(scope,period);if(reportPeriod==='year'){tot={revenue:0,cogs:0,expense:0,other:0,profit:0,sales:0};for(let m=1;m<=12;m++){const s=stats(scope,yr+'-'+String(m).padStart(2,'0'));for(const k of Object.keys(tot))tot[k]+=s[k]}}const series=reportPeriod==='month'?activeBusinesses().filter(b=>filteredBiz(b.id)).map(b=>({label:b.name,value:stats(b.id,period).profit})):Array.from({length:12},(_,i)=>({label:'Tháng '+(i+1),value:stats(scope,yr+'-'+String(i+1).padStart(2,'0')).profit}));return el('Báo cáo tài chính','So sánh lợi nhuận và doanh thu theo lĩnh vực / thời gian')+choices+`<div class="cards">${metric('Doanh thu',money(tot.revenue))}${metric('Giá vốn',money(tot.cogs))}${metric('Chi phí',money(tot.expense))}${metric('Lợi nhuận',money(tot.profit),'Thu khác: '+money(tot.other),tot.profit<0?'negative':'positive')}</div><div class="content-grid"><div class="panel"><h2>Biểu đồ lợi nhuận</h2>${bars(series)}</div><div class="panel"><h2>So sánh theo lĩnh vực</h2><div class="table-wrap"><table><thead><tr><th>Lĩnh vực</th><th>Doanh thu</th><th>Lợi nhuận</th></tr></thead><tbody>${activeBusinesses().filter(b=>filteredBiz(b.id)).map(b=>{const s=stats(b.id,period);return `<tr><td>${esc(b.name)}</td><td>${money(s.revenue)}</td><td>${money(s.profit)}</td></tr>`}).join('')}</tbody></table></div></div></div><div class="note">Giá vốn là giá snapshot tại lúc tạo đơn. Bản demo chưa tự tính lại các đơn cũ khi thêm phiếu nhập quá khứ. Báo cáo theo ngày của cá nhân có thể xem qua danh sách giao dịch và lọc ngày.</div>`}
function orders(){const all=db.orders.filter(o=>filteredBiz(o.businessId));let rows=all.filter(o=>{if(!filterText)return true;let h=(o.code+' '+cname(o.customerId)+' '+(db.customers.find(c=>c.id===o.customerId)?.phone||'')).toLowerCase();return h.includes(filterText.toLowerCase())});const temps=all.filter(o=>o.kind==='temporary').length;return el('Hóa đơn bán hàng','Tạo đơn, lưu ảnh hóa đơn tạm, quản lý trạng thái và khách hàng',`<div class="toolbar"><button class="btn alt" data-action="newtemp">📷 Hóa đơn tạm</button><button class="btn" data-action="neworder">+ Hóa đơn mới</button></div>`)+`<div class="panel" style="margin-bottom:12px"><span class="chip warn">📷 ${temps} hóa đơn tạm chưa hoàn thiện</span> <span class="chip blue">${all.length} hóa đơn tổng</span></div><details class="filters" ${filterOpen?'open':''}><summary>Bộ lọc tìm kiếm ▾</summary><div class="cols3" style="margin-top:12px"><div><label>Tên KH / SĐT / mã</label><input id="orderSearch" value="${esc(filterText)}" placeholder="Nhập từ khóa"></div><div><label>Ngày</label><input type="date" id="orderDate"></div><div><label>Trạng thái</label><select id="orderStatus"><option value="all">Tất cả</option><option value="temporary">Tạm</option><option value="shipped">Đã gửi</option><option value="completed">Hoàn thành</option><option value="returned">Hoàn hàng</option></select></div></div><button class="btn sm alt" data-action="filterOrders" style="margin-top:9px">Lọc</button></details><div class="panel table-wrap"><table><thead><tr><th>Mã hóa đơn</th><th>Ngày</th><th>Khách hàng</th><th>Lĩnh vực</th><th>Tổng</th><th>Đã thu</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="orderRows">${orderRows(rows)}</tbody></table></div>`}
function orderRows(rows){return rows.slice().reverse().map(o=>`<tr data-date="${o.date}" data-status="${o.kind==='temporary'?'temporary':o.status}"><td><b>${esc(o.code)}</b></td><td>${fmtDate(o.date)}</td><td>${esc(cname(o.customerId))}</td><td>${esc(bname(o.businessId))}</td><td>${money(o.total)}</td><td>${money(o.paid)}</td><td><span class="chip ${o.kind==='temporary'?'warn':o.status==='returned'?'bad':o.status==='completed'?'ok':'blue'}">${o.kind==='temporary'?'📷 Tạm':({shipped:'Đã gửi',completed:'Hoàn thành',returned:'Hoàn hàng'}[o.status]||o.status)}</span></td><td><div class="row-actions"><button class="btn sm alt" data-action="editorder" data-id="${o.id}">Sửa</button><button class="btn sm gray" data-action="status" data-id="${o.id}">Trạng thái</button><button class="btn sm danger" data-action="delete" data-table="orders" data-id="${o.id}">Xóa</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Chưa có hóa đơn</td></tr>'}
function purchases(){const rows=db.purchases.filter(p=>filteredBiz(p.businessId));return el('Nhập hàng & tồn kho','Phiếu nhập nhiều dòng; chi tiền nhập hàng từ nguồn thực tế',`<button class="btn" data-action="newpurchase">+ Phiếu nhập</button>`)+`<div class="panel table-wrap"><table><thead><tr><th>Ngày</th><th>Nhà cung cấp</th><th>Lĩnh vực</th><th>Chi tiết</th><th>Giá trị</th><th>Đã trả</th><th>Thao tác</th></tr></thead><tbody>${rows.slice().reverse().map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.supplier)}</td><td>${esc(bname(x.businessId))}</td><td>${x.lines.length} mặt hàng</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td><button class="btn sm alt" data-action="editpurchase" data-id="${x.id}">Sửa</button> <button class="btn sm danger" data-action="delete" data-table="purchases" data-id="${x.id}">Xóa</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Chưa có phiếu nhập</td></tr>'}</tbody></table></div>`}
function products(){let rows=db.products.filter(x=>filteredBiz(x.businessId));return el('Sản phẩm & tồn kho','Giá bán, tồn đầu kỳ, giá vốn bình quân ước tính, lịch sử thay đổi',`<div class="toolbar"><button class="btn alt" data-action="stockadjust">± Điều chỉnh kho</button><button class="btn" data-action="newproduct">+ Sản phẩm</button></div>`)+`<details class="filters" ${filterOpen?'open':''}><summary>Tìm kiếm sản phẩm ▾</summary><div class="toolbar" style="margin-top:10px"><input placeholder="Tên sản phẩm, SKU" id="productSearch"><button class="btn sm alt" data-action="filterProducts">Lọc</button></div></details><div class="panel table-wrap"><table><thead><tr><th>Mã</th><th>Sản phẩm</th><th>Lĩnh vực</th><th>Giá bán</th><th>Tồn kho</th><th>Giá vốn TB</th><th>Thao tác</th></tr></thead><tbody id="productRows">${productRows(rows)}</tbody></table></div>`}
function productRows(rows){return rows.map(p=>`<tr><td>${esc(p.sku||'—')}</td><td><b>${esc(p.name)}</b></td><td>${esc(bname(p.businessId))}</td><td>${money(p.price)}</td><td class="${qtyStock(p.id)<0?'negative':''}">${qtyStock(p.id)}</td><td>${money(averageCost(p.id))}</td><td><div class="row-actions"><button class="btn sm alt" data-action="editproduct" data-id="${p.id}">Sửa</button><button class="btn sm gray" data-action="history" data-table="products" data-id="${p.id}">Lịch sử</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Chưa có sản phẩm</td></tr>'}
function customers(){return el('Khách hàng','Danh bạ chung, dùng cho mọi lĩnh vực',`<button class="btn" data-action="newcustomer">+ Thêm khách</button>`)+`<details class="filters" ${filterOpen?'open':''}><summary>Tìm kiếm khách hàng ▾</summary><div class="toolbar" style="margin-top:10px"><input placeholder="Tên / số điện thoại" id="customerSearch"><button class="btn sm alt" data-action="filterCustomers">Lọc</button></div></details><div class="panel table-wrap"><table><thead><tr><th>Tên</th><th>Điện thoại</th><th>Địa chỉ</th><th>Đơn hàng</th><th>Thao tác</th></tr></thead><tbody id="customerRows">${customerRows(db.customers)}</tbody></table></div>`}
function customerRows(rows){return rows.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.address)}</td><td>${db.orders.filter(o=>o.customerId===c.id).length}</td><td><button class="btn sm alt" data-action="editcustomer" data-id="${c.id}">Sửa</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Chưa có khách</td></tr>'}
function finance(){const accounts=db.accounts.filter(a=>a.active!==false),tr=db.expenses.filter(e=>e.domain==='business'?filteredBiz(e.businessId):true);return el('Tài chính & nguồn tiền','Nguồn tiền dùng chung cho kinh doanh và cá nhân',`<button class="btn" data-action="newexpense">+ Ghi thu / chi</button>`)+`<div class="cards">${accounts.slice(0,4).map(a=>metric(a.name,money(accountBalance(a.id)),a.scope==='shared'?'Dùng chung':'Riêng: '+bname(a.businessId))).join('')}</div><div class="toolbar"><button class="btn alt" data-action="newaccount">+ Nguồn tiền</button><button class="btn alt" data-action="transfer">⇆ Chuyển tiền</button><button class="btn gray" data-action="categories">Quản lý loại chi phí</button></div><div class="panel table-wrap"><h2>Thu / chi & giao dịch tiền</h2><div class="note">Nhập tại đây khi phát sinh phí ship, bao bì, quảng cáo, sinh hoạt cá nhân hoặc khoản thu khác. Tiền bán hàng nhập ở Hóa đơn; tiền nhập hàng nhập ở Phiếu nhập — tránh ghi trùng.</div><table><thead><tr><th>Ngày</th><th>Nhóm</th><th>Loại</th><th>Danh mục</th><th>Nguồn tiền</th><th>Số tiền</th><th>Thao tác</th></tr></thead><tbody>${tr.slice().reverse().map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${e.domain==='personal'?'Cá nhân':esc(bname(e.businessId))}</td><td>${e.type==='income'?'Thu':'Chi'}</td><td>${esc(e.category)}</td><td>${esc(aname(e.accountId))}</td><td class="${e.type==='expense'?'negative':'positive'}">${e.type==='expense'?'-':'+'}${money(e.amount)}</td><td><button class="btn sm alt" data-action="editexpense" data-id="${e.id}">Sửa</button> <button class="btn sm danger" data-action="delete" data-table="expenses" data-id="${e.id}">Xóa</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Chưa phát sinh thu chi</td></tr>'}</tbody></table></div>`}
function settings(){return el('Thiết lập','Quản lý lĩnh vực và cấu hình mặc định — không cần chỉnh source')+`<div class="content-grid"><div class="panel"><div class="side-by-side"><h2>Lĩnh vực kinh doanh</h2><button class="btn sm" data-action="newbusiness">+ Thêm</button></div>${db.businesses.map(b=>`<div class="listline side-by-side"><span>${esc(b.name)} ${b.active===false?'<span class="chip">Đã ẩn</span>':''}</span><button class="btn sm alt" data-action="editbusiness" data-id="${b.id}">Chỉnh sửa</button></div>`).join('')}</div><div class="panel"><h2>Nguồn tiền mặc định</h2><div class="note">Có thể chọn lại khi nhập chứng từ.</div>${[['defaultSaleAccount','Hóa đơn bán'],['defaultPurchaseAccount','Nhập hàng'],['defaultAccount','Chi phí kinh doanh'],['defaultPersonalAccount','Chi tiêu cá nhân']].map(([k,label])=>`<div class="field"><label>${label}</label><select data-setting="${k}">${db.accounts.filter(x=>x.active!==false).map(a=>`<option value="${a.id}" ${db.settings[k]===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`).join('')}<button class="btn sm alt" data-action="newaccount">+ Tạo nguồn tiền</button></div></div><div class="panel" style="margin-top:14px"><h2>Sao lưu / phục hồi</h2><p class="hint">Xuất JSON định kỳ. Nhập JSON sẽ thay toàn bộ dữ liệu đang có trên thiết bị.</p><div class="toolbar"><button class="btn alt" data-action="export">Tải bản sao JSON</button><button class="btn gray" data-action="import">Nhập bản sao JSON</button><button class="btn gray" data-action="auditall">Xem lịch sử chỉnh sửa</button></div></div>`}
function field(label,id,type='text',value='',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,id,options){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${options}</select></div>`}
function modal(title,html,save){$('#modalTitle').textContent=title;$('#modalContent').innerHTML=`${html}<div class="form-actions"><button class="btn gray" id="cancelModal">Hủy</button><button class="btn" id="saveModal">Lưu dữ liệu</button></div>`;$('#modal').showModal();$('#cancelModal').onclick=()=>$('#modal').close();$('#saveModal').onclick=()=>{try{const r=save();if(r!==false){$('#modal').close();toast('Đã lưu thành công')}}catch(e){toast(e.message)}}}
const val=id=>$('#'+id)?.value, requireText=(x,label)=>{if(!String(x||'').trim())throw Error('Cần nhập '+label);return x.trim()},requireMoney=(x,label,zero=false)=>{let v=Number(x);if(!Number.isFinite(v)||v<(zero?0:0.00001))throw Error(label+' phải là số hợp lệ');return v};
function businessForm(id){const old=db.businesses.find(x=>x.id===id);modal(old?'Sửa lĩnh vực':'Tạo lĩnh vực',field('Tên lĩnh vực','bizName','text',old?.name)+selectField('Trạng thái','bizActive',`<option value="true">Đang sử dụng</option><option value="false" ${old?.active===false?'selected':''}>Tạm ẩn</option>`),()=>{const r=storeRecord('businesses',{...old,id:old?.id||uid(),name:requireText(val('bizName'),'tên lĩnh vực'),active:val('bizActive')==='true'});db.settings.defaultBusiness||=r.id;persist()})}
function customerForm(id){const old=db.customers.find(x=>x.id===id);modal(old?'Sửa khách hàng':'Thêm khách hàng',field('Tên khách hàng','name','text',old?.name)+field('Điện thoại','phone','tel',old?.phone)+field('Địa chỉ','address','text',old?.address),()=>storeRecord('customers',{...old,id:old?.id||uid(),name:requireText(val('name'),'tên khách'),phone:val('phone').trim(),address:val('address').trim()}))}
function productForm(id){const old=db.products.find(x=>x.id===id),b=old?.businessId||getScopeBusiness();modal(old?'Sửa sản phẩm':'Tạo sản phẩm',selectField('Lĩnh vực','biz',businessOptions(b))+field('SKU / Mã sản phẩm','sku','text',old?.sku)+field('Tên sản phẩm','name','text',old?.name)+`<div class="cols2">${field('Giá bán dự kiến','price','number',old?.price||0,'min="0"')}${field('Số dư tồn đầu kỳ','openingQty','number',old?.openingQty||0)}</div>`+field('Đơn giá vốn đầu kỳ','openingCost','number',old?.openingCost||0),()=>storeRecord('products',{...old,id:old?.id||uid(),businessId:val('biz'),sku:val('sku').trim(),name:requireText(val('name'),'tên sản phẩm'),price:requireMoney(val('price'),'Giá bán',true),openingQty:num(val('openingQty')),openingCost:requireMoney(val('openingCost'),'Giá vốn',true),active:true}))}
function accountForm(){modal('Thêm nguồn tiền',field('Tên nguồn tiền','accountName')+field('Số dư mở đầu','opening','number',0)+selectField('Phạm vi','accountScope','<option value="shared">Dùng chung toàn bộ</option><option value="private">Riêng một lĩnh vực</option>')+selectField('Lĩnh vực được dùng','business',businessOptions(getScopeBusiness())),()=>storeRecord('accounts',{id:uid(),name:requireText(val('accountName'),'tên nguồn'),opening:num(val('opening')),scope:val('accountScope')==='shared'?'shared':'private',businessId:val('accountScope')==='shared'?null:val('business'),active:true}))}
function transferForm(){const opts=db.accounts.filter(x=>x.active!==false).map(a=>`<option value="${a.id}">${esc(a.name)} (${money(accountBalance(a.id))})</option>`).join('');modal('Chuyển tiền nội bộ',selectField('Nguồn chuyển','from',opts)+selectField('Nguồn nhận','to',opts)+field('Số tiền','amount','number',0,'min="1"')+field('Ngày','date','date',today()),()=>{if(val('from')===val('to'))throw Error('Nguồn chuyển và nhận phải khác nhau');storeRecord('transfers',{id:uid(),from:val('from'),to:val('to'),amount:requireMoney(val('amount'),'Số tiền'),date:val('date')})})}
const defaultCategories=['Phí ship / giao hàng','Phí hoàn hàng','Bao bì / đóng gói','Quảng cáo','Mặt bằng','Điện nước','Nhân công','Chi phí khác'];
function categories(){let c=db.settings.categories||defaultCategories;modal('Quản lý loại chi phí',`<div class="note">Danh mục cũ vẫn lưu theo tên đã ghi trên giao dịch, đổi tên không làm mất lịch sử.</div><div id="categoryList">${c.map((x,i)=>`<div class="listline side-by-side"><span>${esc(x)}</span><button class="btn sm danger" data-cat-remove="${i}">Xóa</button></div>`).join('')}</div>${field('Loại chi phí mới','newCat')}`,()=>{const name=val('newCat').trim();if(name&&!c.includes(name))c.push(name);db.settings.categories=c;persist();render()});$('#categoryList').onclick=e=>{const index=e.target.dataset.catRemove;if(index===undefined)return;c.splice(Number(index),1);db.settings.categories=c;persist();$('#categoryList').innerHTML=c.map((x,i)=>`<div class="listline side-by-side"><span>${esc(x)}</span><button class="btn sm danger" data-cat-remove="${i}">Xóa</button></div>`).join('')}}
function expenseForm(id){const old=db.expenses.find(e=>e.id===id);const b=old?.businessId||getScopeBusiness();const cats=db.settings.categories||defaultCategories;modal(old?'Sửa thu chi':'Ghi thu / chi',selectField('Nhóm','domain',`<option value="business" ${old?.domain!=='personal'?'selected':''}>Kinh doanh</option><option value="personal" ${old?.domain==='personal'?'selected':''}>Cá nhân</option>`)+selectField('Loại','type',`<option value="expense" ${old?.type!=='income'?'selected':''}>Chi tiền</option><option value="income" ${old?.type==='income'?'selected':''}>Thu tiền khác</option>`)+selectField('Lĩnh vực hưởng chi phí','biz',businessOptions(b))+selectField('Nguồn tiền','account',accountOptions(b,old?.accountId||db.settings.defaultAccount))+selectField('Danh mục','cat',Array.from(new Set([...cats,'Ăn uống','Gia đình','Đi lại','Lương','Khác',old?.category].filter(Boolean))).map(s=>`<option ${old?.category===s?'selected':''}>${esc(s)}</option>`).join(''))+field('Diễn giải','note','text',old?.note)+field('Số tiền','amount','number',old?.amount||0)+field('Ngày','date','date',old?.date||today()),()=>storeRecord('expenses',{...old,id:old?.id||uid(),domain:val('domain'),type:val('type'),businessId:val('biz'),accountId:val('account'),category:val('cat'),note:val('note'),amount:requireMoney(val('amount'),'Số tiền'),date:val('date'),allocations:[{businessId:val('biz'),amount:num(val('amount'))}]}))}
function stockForm(){const b=getScopeBusiness(),ps=db.products.filter(x=>x.businessId===b);if(!ps.length)return toast('Hãy tạo sản phẩm trước');modal('Điều chỉnh tồn kho',selectField('Sản phẩm','product',selectProductOptions(b))+field('Thay đổi số lượng (+/-)','delta','number',0)+field('Giá trị đơn vị cho phần tăng','unitCost','number',0)+field('Lý do','reason')+field('Ngày','date','date',today()),()=>{if(!num(val('delta')))throw Error('Số điều chỉnh phải khác 0');storeRecord('movements',{id:uid(),productId:val('product'),businessId:b,qty:num(val('delta')),unitCost:num(val('unitCost')),reason:requireText(val('reason'),'lý do'),date:val('date')})})}
function linesBlock(b,mode){let ps=db.products.filter(p=>p.businessId===b&&p.active!==false);return `<div id="lineList">${editingLines.map((l,i)=>`<div class="listline side-by-side"><div><b>STT ${i+1} — ${esc(l.name||pname(l.productId))}</b><div class="hint">${l.qty} × ${money(mode==='sale'?l.price:l.cost)} = ${money(l.qty*(mode==='sale'?l.price:l.cost))}</div></div><button class="btn sm danger" data-line-remove="${i}">Bỏ</button></div>`).join('')}</div><div class="cols3"><div class="field"><label>Sản phẩm</label><select id="lineProduct"><option value="">-- Chọn hàng --</option>${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>${field('Số lượng','lineQty','number',1,'min="0.001" step="any"')}${field(mode==='sale'?'Đơn giá bán':'Giá nhập','linePrice','number',0,'min="0"')}</div><button class="btn alt sm" id="addLine" type="button">+ Thêm dòng</button><div class="side-by-side" style="margin:12px 0"><b>${editingLines.length} chi tiết</b><b>${money(editingLines.reduce((s,l)=>s+l.qty*(mode==='sale'?l.price:l.cost),0))}</b></div>`}
function orderForm(id,temporary=false){const old=db.orders.find(o=>o.id===id),b=old?.businessId||getScopeBusiness();editingLines=structuredClone(old?.lines||[]);editingImage=old?.image||'';const isTemp=temporary||(old?.kind==='temporary');const html=selectField('Lĩnh vực kinh doanh','biz',businessOptions(b))+field('Ngày hóa đơn','date','date',old?.date||today())+selectField('Khách hàng','customer','<option value="">Khách lẻ</option>'+db.customers.map(c=>`<option value="${c.id}" ${old?.customerId===c.id?'selected':''}>${esc(c.name)} · ${esc(c.phone)}</option>`).join(''))+`<div class="toolbar"><button class="btn sm alt" type="button" id="quickCustomer">+ Khách hàng nhanh</button></div>`+`<div id="orderLinesArea">${isTemp?'<div class="note">Hóa đơn tạm chỉ lưu ảnh, chưa tính doanh thu/tồn kho.</div>':linesBlock(b,'sale')}</div>`+selectField('Nguồn nhận tiền','account',accountOptions(b,old?.accountId||db.settings.defaultSaleAccount))+field('Đã thu (VNĐ)','paid','number',old?.paid||0)+`<div class="field"><label>Ảnh hóa đơn tạm / chứng từ (tối đa ~1MB)</label><input type="file" id="image" accept="image/*" capture="environment">${editingImage?`<div class="hint">Đã có ảnh <img class="thumb" src="${editingImage}" alt="Ảnh hóa đơn"></div>`:''}</div><div class="note">Mã hóa đơn được cấp khi lưu. Hóa đơn đã phát hành giữ nguyên mã khi sửa. Hóa đơn tạm có thể mở lại và chọn “Hoàn thiện hóa đơn”.</div>`+(isTemp?`<label><input id="makeComplete" type="checkbox" style="width:auto"> Chuyển thành hóa đơn hoàn chỉnh</label>`:'');modal(old?'Cập nhật hóa đơn':isTemp?'Hóa đơn tạm':'Hóa đơn mới',html,()=>{const kind=isTemp&&!$('#makeComplete')?.checked?'temporary':'normal',lines=kind==='temporary'?[]:structuredClone(editingLines);if(kind==='normal'&&!lines.length)throw Error('Phải thêm ít nhất một sản phẩm');const date=val('date'),total=lines.reduce((s,l)=>s+l.qty*l.price,0),paid=requireMoney(val('paid'),'Tiền đã thu',true);if(paid>total&&kind==='normal')throw Error('Tiền đã thu vượt tiền hóa đơn');const code=old?.code||nextInvoiceCode(date);if(!old)db.invoiceSequences[date.replaceAll('-','')]=(db.invoiceSequences[date.replaceAll('-','')]||0)+1;storeRecord('orders',{...old,id:old?.id||uid(),code,date,businessId:val('biz'),customerId:val('customer'),accountId:val('account'),kind,status:old?.status||'shipped',lines,total:kind==='temporary'?0:total,paid:kind==='temporary'?0:paid,image:editingImage,refund:old?.refund||0,restock:old?.restock??true});});const preserve=()=>({biz:val('biz'),date:val('date'),customer:val('customer'),account:val('account'),paid:val('paid')});const restore=o=>{for(const k of Object.keys(o))if($('#'+k))$('#'+k).value=o[k]};const bindLine=()=>{const area=$('#orderLinesArea');if(!area)return;area.onclick=e=>{const idx=e.target.dataset.lineRemove;if(idx===undefined)return;const v=preserve();editingLines.splice(Number(idx),1);area.innerHTML=linesBlock(val('biz'),'sale');restore(v);bindLine()};$('#addLine')?.addEventListener('click',()=>{const p=db.products.find(x=>x.id===val('lineProduct'));if(!p)return toast('Chọn sản phẩm');const qty=requireMoney(val('lineQty'),'Số lượng'),price=requireMoney(val('linePrice'),'Giá bán',true);const v=preserve();editingLines.push({id:uid(),productId:p.id,name:p.name,qty,price,costSnapshot:quoteCost(p.id,val('date'))});area.innerHTML=linesBlock(val('biz'),'sale');restore(v);bindLine()});$('#lineProduct')?.addEventListener('change',()=>{const p=db.products.find(x=>x.id===val('lineProduct'));if(p)$('#linePrice').value=p.price})};bindLine();$('#biz').addEventListener('change',()=>{editingLines=[];$('#orderLinesArea').innerHTML=isTemp?'<div class="note">Hóa đơn tạm chỉ lưu ảnh</div>':linesBlock(val('biz'),'sale');$('#account').innerHTML=accountOptions(val('biz'),db.settings.defaultSaleAccount);bindLine()});if($('#makeComplete'))$('#makeComplete').onchange=()=>{const area=$('#orderLinesArea');area.innerHTML=$('#makeComplete').checked?linesBlock(val('biz'),'sale'):'<div class="note">Hóa đơn tạm chỉ lưu ảnh</div>';bindLine()};$('#quickCustomer').onclick=()=>{const name=prompt('Tên khách hàng mới:');if(!name?.trim())return;const phone=prompt('Số điện thoại (có thể để trống):')||'';const c=storeRecord('customers',{id:uid(),name:name.trim(),phone,address:''});$('#customer').innerHTML='<option value="">Khách lẻ</option>'+db.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#customer').value=c.id};$('#image').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>1200000){toast('Ảnh lớn hơn 1,2 MB. Vui lòng nén ảnh trước khi nhập vào local.');e.target.value='';return}editingImage=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)})};}
function nextInvoiceCode(date){const key=date.replaceAll('-','');return key+String((db.invoiceSequences[key]||0)+1).padStart(6,'0')}
function purchaseForm(id){const old=db.purchases.find(p=>p.id===id),b=old?.businessId||getScopeBusiness();editingLines=structuredClone(old?.lines||[]);const html=selectField('Lĩnh vực','biz',businessOptions(b))+field('Ngày nhập','date','date',old?.date||today())+field('Nhà cung cấp','supplier','text',old?.supplier)+`<div id="purchaseLinesArea">${linesBlock(b,'purchase')}</div>`+selectField('Nguồn trả tiền','account',accountOptions(b,old?.accountId||db.settings.defaultPurchaseAccount))+field('Đã trả','paid','number',old?.paid||0);modal(old?'Sửa phiếu nhập':'Tạo phiếu nhập',html,()=>{if(!editingLines.length)throw Error('Cần nhập ít nhất một sản phẩm');let total=editingLines.reduce((s,l)=>s+l.qty*l.cost,0);let paid=requireMoney(val('paid'),'Số tiền đã trả',true);if(paid>total)throw Error('Đã trả vượt tổng phiếu');storeRecord('purchases',{...old,id:old?.id||uid(),date:val('date'),supplier:requireText(val('supplier'),'nhà cung cấp'),businessId:val('biz'),accountId:val('account'),paid,total,lines:structuredClone(editingLines)})});const bind=()=>{const area=$('#purchaseLinesArea');area.onclick=e=>{if(e.target.dataset.lineRemove===undefined)return;editingLines.splice(+e.target.dataset.lineRemove,1);area.innerHTML=linesBlock(val('biz'),'purchase');bind()};$('#addLine').onclick=()=>{const p=db.products.find(x=>x.id===val('lineProduct'));if(!p)return toast('Chọn sản phẩm');editingLines.push({id:uid(),productId:p.id,name:p.name,qty:requireMoney(val('lineQty'),'Số lượng'),cost:requireMoney(val('linePrice'),'Giá nhập',true)});area.innerHTML=linesBlock(val('biz'),'purchase');bind()}};bind();$('#biz').onchange=()=>{editingLines=[];$('#purchaseLinesArea').innerHTML=linesBlock(val('biz'),'purchase');$('#account').innerHTML=accountOptions(val('biz'),db.settings.defaultPurchaseAccount);bind()}}
function statusForm(id){let o=db.orders.find(x=>x.id===id);if(o.kind==='temporary')return orderForm(id,true);modal('Trạng thái hóa đơn '+o.code,selectField('Trạng thái','status',`<option value="shipped" ${o.status==='shipped'?'selected':''}>Đã gửi</option><option value="completed" ${o.status==='completed'?'selected':''}>Hoàn thành</option><option value="returned" ${o.status==='returned'?'selected':''}>Hoàn hàng</option>`)+field('Đã hoàn tiền khách','refund','number',o.refund||0)+selectField('Nguồn hoàn tiền','refundAccount',accountOptions(o.businessId,o.refundAccountId||o.accountId))+selectField('Hàng hoàn còn sử dụng được?','restock',`<option value="true" ${o.restock!==false?'selected':''}>Nhập lại kho</option><option value="false" ${o.restock===false?'selected':''}>Không nhập kho</option>`),()=>{const refund=num(val('refund'));if(val('status')==='returned'&&refund>num(o.paid))throw Error('Hoàn tiền không vượt tiền đã nhận');storeRecord('orders',{...o,status:val('status'),refund:val('status')==='returned'?refund:0,refundAccountId:val('refundAccount'),restock:val('restock')==='true',returnDate:val('status')==='returned'?today():null})})}
function history(table,id){const logs=db.audit.filter(x=>(!id||x.entityId===id)&&(!table||x.entity===table)).slice(0,70);$('#modalTitle').textContent='Lịch sử cập nhật';$('#modalContent').innerHTML=logs.length?logs.map(x=>`<div class="listline"><b>${esc(x.entity)} — ${esc(x.action)}</b><div class="hint">${new Date(x.date).toLocaleString('vi-VN')}</div><details><summary>Giá trị trước / sau</summary><div class="cols2"><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px">Trước: ${esc(JSON.stringify(x.before,null,2))}</pre><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px">Sau: ${esc(JSON.stringify(x.after,null,2))}</pre></div></details></div>`).join(''):'<p>Chưa có lịch sử</p>';$('#modal').showModal()}
function exportJSON(){const blob=new Blob([JSON.stringify({format:'soquanly-v9',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SoQuanLy_V9_Backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='soquanly-v9'||!data.data?.businesses||!data.data?.orders)throw Error('File không đúng định dạng V9');if(!confirm('Dữ liệu mới sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;db=patch(data.data);await persist();scope='all';render();toast('Đã khôi phục dữ liệu')}catch(e){toast('Lỗi import: '+e.message)}finally{e.target.value=''}};
function act(action,id,table){if(action==='newbusiness'||action==='editbusiness')businessForm(id);else if(action==='newcustomer'||action==='editcustomer')customerForm(id);else if(action==='newproduct'||action==='editproduct')productForm(id);else if(action==='newaccount')accountForm();else if(action==='transfer')transferForm();else if(action==='newexpense'||action==='editexpense')expenseForm(id);else if(action==='categories')categories();else if(action==='stockadjust')stockForm();else if(action==='neworder'||action==='editorder')orderForm(id);else if(action==='newtemp')orderForm(null,true);else if(action==='newpurchase'||action==='editpurchase')purchaseForm(id);else if(action==='status')statusForm(id);else if(action==='delete')askDelete(table,id);else if(action==='history')history(table,id);else if(action==='auditall')history();else if(action==='export')exportJSON();else if(action==='import')$('#importFile').click();else if(action==='reportMode'){reportMode=id;render()}else if(action==='filterOrders'){const s=(val('orderSearch')||'').toLowerCase(),date=val('orderDate'),status=val('orderStatus');$$('#orderRows tr').forEach(tr=>{tr.hidden=!(tr.textContent.toLowerCase().includes(s)&&(!date||tr.dataset.date===date)&&(status==='all'||tr.dataset.status===status))})}else if(action==='filterProducts'){const q=(val('productSearch')||'').toLowerCase();$('#productRows').innerHTML=productRows(db.products.filter(p=>filteredBiz(p.businessId)&&(p.name+' '+p.sku).toLowerCase().includes(q)))}else if(action==='filterCustomers'){const q=(val('customerSearch')||'').toLowerCase();$('#customerRows').innerHTML=customerRows(db.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q)))}}
document.addEventListener('click',e=>{const navBtn=e.target.closest('[data-route]');if(navBtn){route=navBtn.dataset.route;filterText='';filterOpen=false;render();window.scrollTo(0,0);return}const btn=e.target.closest('[data-action]');if(btn)act(btn.dataset.action,btn.dataset.id||btn.dataset.val,btn.dataset.table)});
document.addEventListener('change',e=>{if(e.target.id==='scope'){scope=e.target.value;render()}if(e.target.dataset.setting){db.settings[e.target.dataset.setting]=e.target.value;persist();toast('Đã lưu nguồn mặc định')}if(e.target.id==='period'){reportPeriod=e.target.value;render()}if(e.target.id==='month'){reportMonth=reportPeriod==='year'?e.target.value+'-01':e.target.value;render()}});
document.addEventListener('toggle',e=>{if(e.target.matches?.('details.filters'))filterOpen=e.target.open},true);
$('#backupTop').onclick=exportJSON;
(async()=>{if(CLOUD_MODE){render();try{const status=await cloudCall('apiConnectionStatus');if(!status.configured){showConnect();return}const state=await cloudCall('apiInitialize');cloudRevision=state.revision||0;db=patch(state.data);cloudBase=structuredClone(db);cloudReady=true;render();}catch(e){showConnect('Không thể tải dữ liệu Google Drive: '+e.message)}return}const saved=await adapter.load();if(saved)db=patch(saved);render()})();
</script></body></html>
